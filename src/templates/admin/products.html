<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>ReTech - Admin Products</title>
  <link rel="icon" type="image/x-icon" href="/src/static/favicon.ico">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      }
    }
  </script>
  <style>
    .green-dot {
      color: #88d889;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    
    body {
      background: white;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 64px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      top: 56px;
      z-index: 999;
      background-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 0 12px 12px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    .sidebar:hover {
      width: 240px;
    }

    .sidebar a {
      padding: 0.75rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar a:hover {
      background-color: rgba(136, 216, 137, 0.1);
    }

    .sidebar:not(:hover) {
      width: 64px;
    }

    .sidebar:not(:hover) a {
      justify-content: center;
      padding: 0.75rem 0;
    }

    .sidebar:not(:hover) .nav-text {
      opacity: 0;
      transform: translateX(-10px);
      width: 0;
      margin: 0;
    }

    .nav-text {
      transition: all 0.3s ease;
      opacity: 1;
      transform: translateX(0);
      margin-left: 12px;
      width: auto;
    }

    .sidebar li {
      margin-bottom: 0.75rem;
      padding: 0 0.75rem;
    }

    .sidebar svg {
      width: 24px;
      height: 24px;
      min-width: 24px;
    }
    
    .container {
      max-width: 1600px !important;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    
    .logo-text {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 transition-colors duration-200 text-gray-800 dark:text-white">
  <!-- Header -->
  <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm fixed top-0 w-full z-50 border-b dark:border-gray-700/50 border-[#88d889]/50 h-14">
    <div class="container mx-auto h-full px-2 flex justify-between items-center">
      <div class="flex items-center">
        <h1 class="text-3xl font-bold tracking-wider pl-2">
          <span class="logo-text">ReTech</span><span class="green-dot">.</span>
        </h1>
      </div>
      <div class="flex items-center space-x-4">
        <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" onclick="toggleDarkMode()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800 dark:text-white block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800 dark:text-white hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <nav class="sidebar fixed left-0 h-[calc(100vh-56px)] bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm border-r dark:border-gray-700/50 border-[#88d889]/50 z-40 pt-8 px-2 hover:shadow-lg overflow-visible w-16 hover:w-[240px] transition-all duration-300">
    <ul class="space-y-6">
      <li>
        <a href="/" class="hover:text-[#88d889] transition-colors group flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 flex-shrink-0 stroke-gray-800 dark:stroke-white" viewBox="0 0 24 24" fill="none">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span class="nav-text ml-3 whitespace-nowrap transition-all duration-300">Home</span>
        </a>
      </li>
      <li>
        <a href="/shop" class="hover:text-[#88d889] transition-colors group flex items-center">
          <i class="fa-solid fa-store h-6 w-6 flex-shrink-0 text-gray-800 dark:text-white"></i>
          <span class="nav-text ml-3 whitespace-nowrap transition-all duration-300">Shop</span>
        </a>
      </li>
      <li>
        <a href="/admin/products" class="hover:text-[#88d889] transition-colors group flex items-center bg-[#88d889]/10">
          <i class="fa-solid fa-cog h-6 w-6 flex-shrink-0 text-gray-800 dark:text-white"></i>
          <span class="nav-text ml-3 whitespace-nowrap transition-all duration-300">Admin</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="pt-20 pl-24 pr-8 min-h-screen">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Product Management</h1>
        <p class="text-gray-600 dark:text-gray-400">Manage your product catalog</p>
      </div>

      <!-- Add Product Form -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-white">Add New Product</h2>
        <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Product Name</label>
            <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Brand</label>
            <input type="text" name="brand" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category</label>
            <select name="category" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
              <option value="">Select Category</option>
              <option value="Desktop">Desktop</option>
              <option value="Processor">Processor</option>
              <option value="Motherboard">Motherboard</option>
              <option value="Cooling">Cooling</option>
              <option value="Single Board Computer">Single Board Computer</option>
              <option value="Monitor">Monitor</option>
              <option value="Memory">Memory</option>
              <option value="Storage">Storage</option>
              <option value="Graphics Card">Graphics Card</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
            <textarea name="description" required rows="3" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white"></textarea>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Price (₹)</label>
            <input type="number" name="price" required min="0" step="0.01" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Original Price (₹)</label>
            <input type="number" name="original_price" min="0" step="0.01" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Discount (%)</label>
            <input type="number" name="discount_percentage" min="0" max="100" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Image Path</label>
            <input type="text" name="image" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white" placeholder="/src/images/product.png">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Stock</label>
            <input type="number" name="stock" required min="0" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Rating</label>
            <input type="number" name="rating" min="0" max="5" step="0.1" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#88d889] focus:border-transparent dark:bg-gray-700 dark:text-white">
          </div>
          
          <div class="md:col-span-2 lg:col-span-3">
            <button type="submit" class="bg-[#88d889] hover:bg-[#7ac97b] text-white px-6 py-2 rounded-lg transition-colors">
              Add Product
            </button>
          </div>
        </form>
      </div>

      <!-- Products Table -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
          <h2 class="text-xl font-semibold text-gray-800 dark:text-white">All Products</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Product</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Category</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Price</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Stock</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
              <!-- Products will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Admin functionality
    class AdminManager {
      constructor() {
        this.products = [];
        this.init();
      }

      async init() {
        await this.loadProducts();
        this.setupEventListeners();
        this.renderProductsTable();
      }

      async loadProducts() {
        try {
          const response = await fetch('/api/shop/products');
          const data = await response.json();
          
          if (data.status === 'success') {
            this.products = data.products;
          } else {
            console.error('Failed to load products:', data.message);
          }
        } catch (error) {
          console.error('Error loading products:', error);
        }
      }

      setupEventListeners() {
        const form = document.getElementById('addProductForm');
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            this.addProduct();
          });
        }
      }

      async addProduct() {
        const form = document.getElementById('addProductForm');
        const formData = new FormData(form);
        
        const productData = {
          name: formData.get('name'),
          brand: formData.get('brand'),
          category: formData.get('category'),
          description: formData.get('description'),
          price: parseFloat(formData.get('price')),
          original_price: parseFloat(formData.get('original_price')) || parseFloat(formData.get('price')),
          discount_percentage: parseFloat(formData.get('discount_percentage')) || 0,
          image: formData.get('image'),
          stock: parseInt(formData.get('stock')),
          rating: parseFloat(formData.get('rating')) || 0,
          reviews: 0,
          condition: 'New',
          specs: {},
          tags: []
        };

        try {
          const response = await fetch('/api/admin/products', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(productData)
          });

          const data = await response.json();
          
          if (data.status === 'success') {
            this.showNotification('Product added successfully!', 'success');
            form.reset();
            await this.loadProducts();
            this.renderProductsTable();
          } else {
            this.showNotification('Failed to add product: ' + data.message, 'error');
          }
        } catch (error) {
          console.error('Error adding product:', error);
          this.showNotification('Error adding product', 'error');
        }
      }

      renderProductsTable() {
        const tbody = document.getElementById('productsTableBody');
        if (!tbody) return;

        tbody.innerHTML = this.products.map(product => `
          <tr>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center">
                <img class="h-10 w-10 rounded-lg object-cover" src="${product.image}" alt="${product.name}">
                <div class="ml-4">
                  <div class="text-sm font-medium text-gray-900 dark:text-white">${product.name}</div>
                  <div class="text-sm text-gray-500 dark:text-gray-400">${product.brand}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-[#88d889]/10 text-[#88d889]">
                ${product.category}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">
              ₹${product.price.toLocaleString()}
              ${product.original_price > product.price ? 
                `<span class="text-gray-500 dark:text-gray-400 line-through ml-2">₹${product.original_price.toLocaleString()}</span>` : ''
              }
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">
              ${product.stock}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
              <button class="text-[#88d889] hover:text-[#7ac97b] mr-3" onclick="adminManager.editProduct('${product.id}')">
                Edit
              </button>
              <button class="text-red-600 hover:text-red-900" onclick="adminManager.deleteProduct('${product.id}')">
                Delete
              </button>
            </td>
          </tr>
        `).join('');
      }

      editProduct(productId) {
        // TODO: Implement edit functionality
        console.log('Edit product:', productId);
      }

      async deleteProduct(productId) {
        if (!confirm('Are you sure you want to delete this product?')) return;

        try {
          const response = await fetch(`/api/admin/products/${productId}`, {
            method: 'DELETE'
          });

          const data = await response.json();
          
          if (data.status === 'success') {
            this.showNotification('Product deleted successfully!', 'success');
            await this.loadProducts();
            this.renderProductsTable();
          } else {
            this.showNotification('Failed to delete product: ' + data.message, 'error');
          }
        } catch (error) {
          console.error('Error deleting product:', error);
          this.showNotification('Error deleting product', 'error');
        }
      }

      showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = `fixed top-20 right-4 z-50 px-6 py-3 rounded-lg shadow-lg transition-all duration-300 transform translate-x-full ${
          type === 'success' ? 'bg-green-500 text-white' : 
          type === 'error' ? 'bg-red-500 text-white' : 
          'bg-blue-500 text-white'
        }`;
        notification.textContent = message;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.classList.remove('translate-x-full');
        }, 100);
        
        setTimeout(() => {
          notification.classList.add('translate-x-full');
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 3000);
      }
    }

    // Initialize admin when DOM is loaded
    let adminManager;
    document.addEventListener('DOMContentLoaded', () => {
      adminManager = new AdminManager();
    });

    function toggleDarkMode() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('darkMode', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('darkMode', 'dark');
      }
    }

    // Check for saved dark mode preference
    document.addEventListener('DOMContentLoaded', () => {
      const darkMode = localStorage.getItem('darkMode');
      if (darkMode === 'dark') {
        document.documentElement.classList.add('dark');
      }
    });
  </script>
</body>
</html>
